name: Build admin from jokns fork
on:
  workflow_dispatch:
    inputs:
      admin_ref:
        description: 'Admin fork branch or commit (default: feature PR branch)'
        required: false
        default: 'feature/node-dns-and-ip-toggle-20261114'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          path: backend
      - name: Checkout owned admin fork
        uses: actions/checkout@v4
        with:
          repository: jokns/v2board-admin
          ref: ${{ inputs.admin_ref }}
          path: v2board-admin
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
          cache-dependency-path: v2board-admin/pnpm-lock.yaml
      - name: Build and embed
        working-directory: backend
        run: bash build-admin.sh ../v2board-admin
      - name: Verify embedded assets
        working-directory: backend
        run: |
          test -s public/assets/admin/assets/admin.js
          test -s public/assets/admin/assets/admin.css
          grep -q 'github.com/jokns/v2board-admin' public/assets/admin/SOURCE
      - name: Upload reviewable admin assets
        uses: actions/upload-artifact@v4
        with:
          name: v2board-admin-embedded-assets
          path: backend/public/assets/admin/
          if-no-files-found: error
